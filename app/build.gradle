plugins {
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

def fxVersion = '21.0.2'

// Pick the correct JavaFX classifier for the OS/arch running Gradle
def os = org.gradle.internal.os.OperatingSystem.current()
def arch = System.getProperty("os.arch")
def fxPlatform =
        os.isWindows() ? 'win' :
        os.isMacOsX()  ? (arch.contains('aarch64') ? 'mac-aarch64' : 'mac') :
                         (arch.contains('aarch64') ? 'linux-aarch64' : 'linux')

dependencies {
    implementation "org.openjfx:javafx-base:${fxVersion}:${fxPlatform}"
    implementation "org.openjfx:javafx-graphics:${fxVersion}:${fxPlatform}"
    implementation "org.openjfx:javafx-controls:${fxVersion}:${fxPlatform}"
    implementation "org.openjfx:javafx-fxml:${fxVersion}:${fxPlatform}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.0"
}

java {
    // Force Gradle to use JDK 21 for compile/run even if 24 is installed
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = "org.example.ConverterUI"
}

// <<< The crucial bit: put JavaFX jars on the module-path for the run task
tasks.named('run') {
    doFirst {
        jvmArgs = [
            "--module-path", configurations.runtimeClasspath.asPath,
            "--add-modules", "javafx.controls,javafx.fxml"
        ]
    }
}

// Disable tests for now to avoid the JUnit Platform noise
tasks.test {
    useJUnitPlatform()
    enabled = false
}
